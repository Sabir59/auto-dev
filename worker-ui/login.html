<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AI Worker</title>
<link rel="icon" href="/assets/monogram.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* The workspace's own tokens (workspace.html), so signing in looks like the product it opens. */
:root {
  --bg: #0d0f14; --low: #12151b; --surf: #191c24; --line: #232733; --line2: #2f3442;
  --t1: #e8eaf0; --t2: #b8bfcc; --t3: #8f98a8; --pri-c: #2aa9ee; --on-pri: #032235; --err: #ff9b92; --err-soft: rgba(255, 155, 146, .12);
  --r2: 6px; --r3: 10px; --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--t1); font: 400 14px/20px var(--sans); display: grid; place-items: center; padding: 16px; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 360px; }
h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0 0 4px; }
p.sub { color: var(--t2); margin: 0 0 24px; }
form { display: flex; flex-direction: column; gap: 14px; background: var(--low); border: 1px solid var(--line); border-radius: var(--r3); padding: 20px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--t2); }
input { font: inherit; color: var(--t1); background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r2); padding: 9px 10px; }
input:focus { outline: 2px solid var(--pri-c); outline-offset: 1px; border-color: transparent; }
button { font: 600 14px/20px var(--sans); color: var(--on-pri); background: var(--pri-c); border: 0; border-radius: var(--r2); padding: 10px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--err); background: var(--err-soft); border-radius: var(--r2); padding: 8px 10px; font-size: 13px; }
.err:empty { display: none; }
.foot { color: var(--t3); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>AI Worker</h1>
  <p class="sub">Sign in to your workspace.</p>
  <form id="f" novalidate>
    <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" role="alert"></div>
    <button type="submit" id="go">Sign in</button>
  </form>
  <p class="foot">Accounts are created by the platform administrator during the pilot.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("f").onsubmit = async (e) => {
  e.preventDefault(); $("err").textContent = ""; $("go").disabled = true;
  try {
    const r = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return location.assign("/");
    $("err").textContent = j.error || "Couldn't sign in.";
  } catch { $("err").textContent = "Couldn't reach the server. Check your connection and try again."; }
  $("go").disabled = false;
};
</script>
</body>
</html>
