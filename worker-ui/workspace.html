<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workspace</title>
<link rel="icon" href="/assets/monogram.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Tokens, measured from the Stitch design (Figma "Test Scripter" → Main → "Html → Body"). */
:root {
  --bg: #0c0e13; --low: #1a1b21; --surf: #1e1f25; --high: #282a2f;
  --t1: #e2e2e9; --t2: #bec8d2; --t3: #88929b; --t4: #3e4850;
  --pri: #89ceff; --pri-c: #0ea5e9; --on-pri: #00344d; --ok: #4edea3; --star: #ffb95f; --err: #ffb4ab;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--t1); font: 400 12px/20px var(--sans);
  display: grid; grid-template-columns: 256px minmax(0, 1fr) 320px; grid-template-rows: 56px minmax(0, 1fr);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 1px solid var(--pri); outline-offset: 1px; }
svg.i { display: block; flex: none; fill: currentColor; }
.m11 { font: 400 11px/14px var(--mono); letter-spacing: .44px; }
.m12 { font: 400 12px/21.6px var(--mono); }
.lab { font: 400 11px/14px var(--mono); letter-spacing: .55px; text-transform: uppercase; color: var(--t3); }
.dot { width: 6px; height: 6px; border-radius: 12px; background: var(--ok); flex: none; }
.dot.grey { background: var(--t3); } .dot.blue { background: var(--pri); } .dot.red { background: var(--err); }
.dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--high); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }

/* ---- header ---- */
header.top {
  grid-column: 1 / -1; position: relative; z-index: 20; height: 56px; padding: 0 16px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: rgba(26, 27, 33, .95); box-shadow: 0 1px 8px rgba(0, 0, 0, .04); backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 32px; height: 32px; display: block; }
.brand .name { font: 500 16px/24px var(--sans); letter-spacing: -.16px; color: var(--t1); }
.brand .para { display: flex; align-items: flex-end; gap: 4px; }
.brand .ver { color: var(--t3); margin-bottom: 2px; }
.switcher { height: 24px; display: flex; align-items: center; gap: 4px; padding: 4px 12px; background: var(--surf); border-radius: 2px; max-width: 360px; }
.switcher .txt { font: 500 13px/16px var(--sans); letter-spacing: .13px; color: var(--t1); }
.switcher .i { color: var(--t3); }
.switcher .chev { margin-left: 4px; }
.hright { display: flex; align-items: center; gap: 12px; justify-self: end; }
.pill { height: 30px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--surf); border-radius: 2px; color: var(--t2); }
.pill .dot { width: 8px; height: 8px; }
.kbd { height: 18px; padding: 2px 4px; background: var(--surf); border-radius: 2px; color: var(--t3); }
.hicon { width: 20px; height: 30px; padding: 4px; color: var(--t2); display: flex; justify-content: center; }
.avatar { width: 32px; height: 32px; border-radius: 12px; background: var(--pri); color: var(--on-pri); display: flex; align-items: center; justify-content: center; }
.menu { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); min-width: 240px; background: var(--surf); border-radius: 2px; padding: 4px; box-shadow: 0 2px 4px -2px rgba(0,0,0,.1), 0 4px 6px -1px rgba(0,0,0,.1), 0 8px 24px rgba(0,0,0,.35); z-index: 30; }
.menu button { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 2px; color: var(--t2); text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--high); }
.toggle { display: none; width: 28px; height: 28px; border-radius: 2px; color: var(--t2); align-items: center; justify-content: center; }
.toggle:hover { background: var(--surf); }

/* ---- left sidebar ---- */
aside.left { background: var(--low); display: flex; flex-direction: column; min-height: 0; }
.lscroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.sect { display: flex; flex-direction: column; gap: 4px; }
.sect > .lab { padding: 0 4px 4px; }
.sect ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.row { width: 100%; min-height: 28px; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 2px; color: var(--t2); text-align: left; }
.row:hover { background: var(--surf); }
.row[aria-current="true"] { color: var(--t1); }
.row .grow { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0; }
.row .meta { color: var(--t3); flex: none; display: flex; align-items: center; gap: 4px; }
.ws.row { min-height: 30px; }
.badge { padding: 0 4px; background: var(--surf); border-radius: 2px; color: var(--t3); }
.row:hover .badge { background: var(--high); }
.add.row { color: var(--t3); }
.add .i { color: var(--t3); margin-right: 0; }
.star { color: var(--star); font: 500 11px/14px var(--sans); width: 11px; text-align: center; flex: none; }
.wsi { position: relative; }
.wsi.dragging { opacity: .4; }
.wsi.drop-before::before, .wsi.drop-after::after { content: ""; position: absolute; left: 8px; right: 8px; height: 2px; border-radius: 1px; background: var(--pri); pointer-events: none; }
.wsi.drop-before::before { top: -3px; } .wsi.drop-after::after { bottom: -3px; }
.wsi .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none; width: 20px; height: 20px; border-radius: 2px; background: var(--surf); color: var(--t3); align-items: center; justify-content: center; }
.wsi:hover .x, .wsi:focus-within .x { display: flex; }
.wsi:hover .row .meta, .wsi:focus-within .row .meta { padding-right: 22px; }
.wsi .x:hover { color: var(--t1); background: var(--high); }
.btn.danger { color: var(--err); }
.fav { position: relative; }
.fav .x { display: none; width: 18px; height: 18px; border-radius: 2px; color: var(--t3); align-items: center; justify-content: center; flex: none; }
.fav:hover .x, .fav:focus-within .x { display: flex; }
.fav .x:hover { color: var(--t1); background: var(--high); }
.empty { color: var(--t3); padding: 4px 8px; }
.tree .row { min-height: 24px; padding-top: 2px; padding-bottom: 2px; }
.tree .tw { width: 12px; flex: none; color: var(--t3); display: flex; justify-content: center; }
.tree .tw svg { transition: transform .12s; } .tree [aria-expanded="true"] .tw svg { transform: rotate(90deg); }
.tree .ficon { color: var(--t3); }
.tree .row[aria-selected="true"] { background: var(--surf); color: var(--t1); }
.lfoot { background: var(--surf); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.lfoot .r1 { height: 22px; display: flex; align-items: center; justify-content: space-between; color: var(--t3); }
.lfoot .r1 .dot { width: 8px; height: 8px; margin-right: 4px; }
.lfoot .r2 { padding-top: 4px; height: 24px; display: flex; align-items: center; justify-content: space-between; color: var(--t3); }
.addform { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surf); border-radius: 2px; }
.addform label { color: var(--t3); display: flex; flex-direction: column; gap: 2px; }
.addform input { width: 100%; background: var(--low); color: var(--t1); border: 0; border-radius: 2px; padding: 4px 6px; font: 400 12px/20px var(--sans); }
.addform input.mono { font: 400 11px/20px var(--mono); }
.addform .field { color: var(--t3); display: flex; flex-direction: column; gap: 2px; }
.pathrow { display: flex; gap: 4px; }
.pathrow input { flex: 1; min-width: 0; }
.pathrow .btn { height: 28px; flex: none; }
.btn:hover:not(:disabled) { color: var(--t1); }
.btn:disabled { opacity: .6; }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; padding: 2px 6px; border-radius: 2px; background: var(--low); color: var(--t3); }
.seg button[aria-pressed="true"] { background: var(--high); color: var(--t1); }
.addform .help { color: var(--t3); }
.addform .acts { display: flex; gap: 6px; justify-content: flex-end; }
.btn { padding: 2px 10px; border-radius: 2px; background: var(--high); color: var(--t2); }
.btn.pri { background: var(--pri-c); color: var(--on-pri); font-weight: 500; }
.err { color: var(--err); }

/* ---- centre ---- */
main { min-width: 0; min-height: 0; padding: 0 16px 32px; display: flex; justify-content: center; }
.view { width: 100%; max-width: 860px; min-height: 0; padding: 0 12px; display: flex; flex-direction: column; }
.ctx { height: 40px; flex: none; padding: 4px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ctx .l, .ctx .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctx .r { gap: 4px; flex: none; }
.wschip { height: 28px; display: flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--high); border-radius: 2px; min-width: 0; }
.wschip .txt { font: 500 16px/24px var(--sans); letter-spacing: -.4px; color: var(--t1); }
.brchip { height: 18px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; background: var(--surf); border-radius: 2px; color: var(--t3); flex: none; }
.hash { color: var(--t4); flex: none; }
.stchip { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--surf); border-radius: 2px; color: var(--t2); }
.stchip.act:hover { background: var(--high); }
.sq { width: 20px; height: 27px; padding: 4px 4px 11.2px; background: var(--surf); border-radius: 2px; color: var(--t3); }
.canvas { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.emptyst { margin: auto 0; padding: 24px 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.motif { width: 48px; height: 48px; border-radius: 8px; background: var(--surf); box-shadow: 0 1px 2px rgba(0,0,0,.05); display: flex; align-items: center; justify-content: center; color: var(--pri); margin-bottom: 16px; }
.emptyst h1 { margin: 0; font: 500 24px/32px var(--sans); letter-spacing: -.6px; color: var(--t1); }
.emptyst p { margin: 3.375px 0 0; max-width: 443px; font: 400 14px/22.75px var(--sans); color: var(--t2); }
.tagline { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; color: var(--t3); max-width: 100%; }
.tagline span { display: flex; align-items: center; gap: 4px; min-width: 0; }
.tagline .dot { width: 4px; height: 4px; }

/* chat thread: not drawn in the design; built from the design's own type and surfaces */
.thread { padding: 16px 0 24px; display: flex; flex-direction: column; gap: 16px; }
.msg-u { align-self: flex-end; max-width: 82%; background: var(--surf); border-radius: 8px; padding: 8px 12px; font: 400 14px/22.75px var(--sans); color: var(--t1); white-space: pre-wrap; word-wrap: break-word; }
.msg-w { font: 400 14px/22.75px var(--sans); color: var(--t1); word-wrap: break-word; }
.msg-w > :first-child { margin-top: 0; } .msg-w > :last-child { margin-bottom: 0; }
.msg-w p { margin: 0 0 10px; }
.msg-w h2, .msg-w h3, .msg-w h4 { font: 500 15px/24px var(--sans); margin: 14px 0 6px; color: var(--t1); }
.msg-w h2 { font-size: 16px; }
.msg-w ul, .msg-w ol { margin: 0 0 10px; padding-left: 20px; } .msg-w li { margin: 2px 0; }
.msg-w code { font: 400 12.5px/20px var(--mono); background: var(--surf); border-radius: 2px; padding: 1px 4px; color: var(--t2); }
.msg-w pre { margin: 0 0 10px; background: var(--low); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.msg-w pre code { background: none; padding: 0; font-size: 12px; color: var(--t2); }
.msg-w table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; line-height: 20px; display: block; overflow-x: auto; }
.msg-w th, .msg-w td { border-bottom: 1px solid var(--high); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.msg-w th { color: var(--t3); font-weight: 500; }
.msg-w strong { font-weight: 600; color: var(--t1); }
.tag { display: inline-block; font: 400 11px/14px var(--mono); letter-spacing: .44px; padding: 1px 4px; border-radius: 2px; background: var(--surf); color: var(--t3); margin-right: 6px; vertical-align: 1px; }
.tag.DONE, .tag.VERIFICATION { color: var(--ok); } .tag.FAILURE { color: var(--err); } .tag.PLAN, .tag.DECISION { color: var(--pri); }
.sys { display: flex; align-items: center; gap: 6px; color: var(--t3); }
.sys.err { color: var(--err); }
.working { display: flex; align-items: center; gap: 6px; color: var(--t3); min-width: 0; }
.working .dot { background: var(--pri); }

/* file viewer */
.viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--low); border-radius: 8px; margin: 8px 0 0; overflow: hidden; }
.vbar { height: 36px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; background: var(--surf); color: var(--t2); }
.vbar .ell { flex: 1; }
.vbar .ro { color: var(--t3); }
.iconbtn { width: 24px; height: 24px; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--t3); flex: none; }
.iconbtn:hover { background: var(--high); color: var(--t1); }
.vbody { flex: 1; overflow: auto; }
.code { display: grid; grid-template-columns: auto 1fr; font: 400 12px/20px var(--mono); padding: 8px 0; }
.code .ln { color: var(--t4); text-align: right; padding: 0 12px 0 16px; user-select: none; white-space: pre; }
.code .tx { color: var(--t2); white-space: pre; padding-right: 16px; tab-size: 2; }
.vnote { padding: 24px; color: var(--t3); }
.vimg { padding: 16px; } .vimg img { max-width: 100%; height: auto; background: repeating-conic-gradient(#20222a 0 25%, #191a20 0 50%) 0 0 / 16px 16px; }

/* composer */
.composer { flex: none; padding: 8px 0 4px; }
.cbox { position: relative; background: var(--low); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 7.2px; box-shadow: 0 2px 4px -2px rgba(0,0,0,.1), 0 4px 6px -1px rgba(0,0,0,.1); }
.cbox textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; color: var(--t1); padding: 4px 4px 26.75px; font: 400 14px/22.75px var(--sans); min-height: 54px; max-height: 240px; }
.cbox textarea::placeholder { color: rgba(136, 146, 155, .7); }
.urow { height: 32px; padding: 4px 4px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.urow .l, .urow .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.attach { width: 28px; height: 28px; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--t3); flex: none; }
.cbadge { height: 18px; display: flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--surf); border-radius: 2px; color: var(--t2); min-width: 0; }
.cbadge .sl, .cbadge .br { color: var(--t3); }
.mtag { height: 18px; display: flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--surf); border-radius: 2px; color: var(--t3); flex: none; }
.savep { height: 18px; padding: 0 6px; border-radius: 2px; color: var(--t3); flex: none; }
.savep:hover { background: var(--surf); color: var(--t1); } .savep.done { color: var(--star); }
.hint { color: var(--t3); flex: none; }
.send { width: 28px; height: 28px; border-radius: 2px; background: var(--pri-c); color: var(--on-pri); display: flex; align-items: center; justify-content: center; flex: none; }
.send:disabled { opacity: .45; }
.send.stop { background: var(--high); color: var(--t1); }
.foot { height: 18px; padding: 4px 4px 0; display: flex; justify-content: space-between; gap: 12px; color: var(--t3); opacity: .8; }
.foot .err { opacity: 1; }

/* ---- right: activity ---- */
aside.right { background: var(--low); display: flex; flex-direction: column; min-height: 0; }
.rhead { padding: 12px 12px 0; flex: none; }
.rhead .h { height: 22px; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.rhead .h .t { display: flex; align-items: center; gap: 4px; color: var(--t1); }
.rhead .h .t .i { color: var(--pri); }
.rhead .h .t .lab { color: var(--t1); }
.live { padding: 0 4px; background: var(--surf); border-radius: 2px; color: var(--ok); }
#acts { flex: 1; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; }
.card { background: var(--surf); border-radius: 2px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.card .ch { height: 22px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .ct { color: var(--t1); display: flex; align-items: center; gap: 6px; min-width: 0; }
.card .cm { color: var(--t3); flex: none; display: flex; align-items: center; gap: 6px; }
.card .cm.ok { color: var(--ok); } .card .cm.bad { color: var(--err); } .card .cm.run { color: var(--pri); }
.card .cb { color: var(--t2); word-wrap: break-word; overflow-wrap: anywhere; }
.card .cb code { font: 400 11px/20px var(--mono); color: var(--t2); }
.card .cx { color: var(--t3); font: 400 11px/16px var(--mono); overflow-wrap: anywhere; }
.card a, .card .link { color: var(--pri); text-decoration: none; cursor: pointer; } .card .link:hover { text-decoration: underline; }
.turn { color: var(--t3); padding: 4px 2px 0; display: flex; align-items: center; gap: 8px; }
.turn::after { content: ""; flex: 1; height: 1px; background: var(--surf); }
.rfoot { height: 38px; flex: none; background: var(--surf); padding: 8px; display: flex; align-items: center; justify-content: space-between; color: var(--t3); }
.rfoot .s { display: flex; align-items: center; gap: 4px; }

/* ---- smaller windows ---- */
@media (max-width: 1180px) { body { grid-template-columns: 232px minmax(0, 1fr) 288px; } }
@media (max-width: 980px) {
  body { grid-template-columns: 232px minmax(0, 1fr); }
  aside.right { position: fixed; top: 56px; right: 0; bottom: 0; width: min(320px, 90vw); z-index: 15; box-shadow: -8px 0 24px rgba(0,0,0,.35); display: none; }
  body.show-act aside.right { display: flex; }
  #actToggle { display: flex; }
  .kbd, .hicon { display: none; }
}
@media (max-width: 720px) {
  body { grid-template-columns: minmax(0, 1fr); }
  aside.left { position: fixed; top: 56px; left: 0; bottom: 0; width: min(280px, 88vw); z-index: 15; box-shadow: 8px 0 24px rgba(0,0,0,.35); display: none; }
  body.show-nav aside.left { display: flex; }
  #navToggle { display: flex; }
  .brand .ver, .avatar { display: none; }
  main { padding: 0 8px 8px; } .view { padding: 0 4px; }
  .hint, .mtag { display: none; }
}
@media (max-width: 520px) { .switcher { display: none; } .brand .name { display: none; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } .tree .tw svg { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <button class="toggle" id="navToggle" aria-label="Show workspaces" aria-expanded="false"><svg class="i" width="14" height="11" data-i="tune"></svg></button>
    <img src="/assets/monogram.png" alt="">
    <span class="para"><span class="name">AI Workspace</span><span class="ver m11">local</span></span>
  </div>
  <div style="position:relative">
    <button class="switcher" id="switcher" aria-haspopup="menu" aria-expanded="false" aria-label="Switch workspace">
      <span class="dot" id="swDot"></span><svg class="i" width="11" height="11" data-i="branch"></svg><span class="txt ell" id="swLabel">…</span><svg class="i chev" width="8" height="5" data-i="chevron"></svg>
    </button>
    <div class="menu" id="swMenu" role="menu" hidden></div>
  </div>
  <div class="hright">
    <button class="toggle" id="actToggle" aria-label="Show activity" aria-expanded="false"><svg class="i" width="14" height="11" data-i="terminalSm"></svg></button>
    <div class="pill m12" role="status" aria-live="polite"><span class="dot" id="wDot"></span><span id="wState">Worker · Ready</span></div>
    <!-- Drawn in the design; no behaviour defined yet, so shown but not interactive. -->
    <span class="kbd m11" aria-hidden="true">⌘K</span>
    <span class="hicon" aria-hidden="true"><svg class="i" width="12" height="15" data-i="bell"></svg></span>
    <span class="hicon" aria-hidden="true" style="width:23px"><svg class="i" width="15" height="15" data-i="gear"></svg></span>
    <span class="avatar" aria-hidden="true"><svg class="i" width="12" height="12" data-i="person"></svg></span>

        k--; out.push(h + "</tbody></table>"); continue;
      }
      const hm = /^(#{1,4})\s+(.*)$/.exec(l);
      if (hm) { flush(); const n = Math.min(4, hm[1].length + 1); out.push(`<h${n}>${inline(hm[2])}</h${n}>`); continue; }
      const tm = TAGRE.exec(l);
      const tag = tm ? `<span class="tag ${tm[2].toUpperCase()}">${tm[2].toUpperCase()}</span>` : "";
      if (tm) l = tm[1] + l.slice(tm[0].length);
      const lm = /^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/.exec(l);
      if (lm) {
        const type = lm[1] ? "ul" : "ol";
        if (para.length) { out.push(`<p>${para.join("<br>")}</p>`); para = []; }
        if (list !== type) { if (list) out.push(`</${list}>`); out.push(`<${type}>`); list = type; }
        out.push(`<li>${tag}${inline(lm[3])}</li>`); continue;
      }
      if (list) { out.push(`</${list}>`); list = null; }
      para.push(tag + inline(l));
    }
    flush();
  });
  return out.join("");
}

function freshState() { return { items: [], cards: [], openTools: new Map(), turnStart: null, lastSecs: null, status: null, current: null, n: 0, arts: new Set() }; }

async function openRun(id) {

  runId = id; view = "chat";
  if (runWs(meta) !== wsId) { wsId = runWs(meta); store.set("ws", wsId); renderWorkspaces(); loadTree(); }
  renderRuns(); renderWorkspaces();

  // reconnects), so the view is rebuilt from scratch each time the stream opens.
  es = new EventSource(`/events?run=${encodeURIComponent(id)}`);

  es.onmessage = (m) => onEvent(JSON.parse(m.data));

function onEvent(ev) {
  if (!T) return;
  const t = ev.type, at = Date.parse(ev.ts);
  if (t === "user") { T.items.push({ k: "u", text: ev.summary }); T.turnStart = at; T.n++; addTurn(ev); }
  else if (t === "reply") T.items.push({ k: "w", text: ev.summary });
  else if (t === "tool") {
    const [verb, arg] = phrase(ev);
    const card = addCard({ title: ENV_LABEL[ev.env] || ev.env, meta: "Running", metaCls: "run", body: `${esc(verb)}${arg ? ` <code>${esc(arg)}</code>` : ""}`, running: true });
    card.start = at; T.openTools.set(ev.ref || `last:${ev.tool}`, card); T.current = `${verb}${arg ? " " + arg : ""}`;
  } else if (t === "result" || (t === "failure" && ev.tool)) {
    const card = T.openTools.get(ev.ref || `last:${ev.tool}`);
    if (card) {
      T.openTools.delete(ev.ref || `last:${ev.tool}`);
      const ok = t === "result";
      setCardMeta(card, `${ok ? "Success" : "Failed"} · ${dur(at - card.start)}`, ok ? "ok" : "bad");
      if (!ok) card.el.insertAdjacentHTML("beforeend", `<div class="cx">${esc(ev.summary)}</div>`);
    }
  } else if (t === "failure") addCard({ title: "Failure", meta: "", body: esc(ev.summary), metaCls: "bad" });
  else if (["plan", "observation", "decision", "verification", "recovery", "done"].includes(t)) {
    addCard({ title: t[0].toUpperCase() + t.slice(1), meta: t === "done" ? "Complete" : t === "verification" ? "Check" : "", metaCls: t === "done" || t === "verification" ? "ok" : "", body: esc(ev.summary) });
  } else if (t === "artifact") {
    if (!T.arts.has(ev.summary)) { T.arts.add(ev.summary); addCard({ title: "Artifact", meta: "", body: `<span class="link" role="link" tabindex="0" data-art="${esc(ev.summary)}">${esc(ev.summary)}</span>` }); }
  } else if (t === "start") {
    const servers = String(ev.detail || "").replace(/^MCP /, "").split(", ").filter(Boolean).map((s) => { const [n, st] = s.split(": "); return `${n.replace(/-executor$/, "")} ${st}`; });
    addCard({ title: "Worker started", meta: "", body: servers.length ? esc(servers.join(" · ")) : "Claude Code worker process" });
  } else if (t === "note" && /^Resuming/.test(ev.summary)) {
    addCard({ title: "Resumed", meta: "", body: "Same conversation in a new worker process. Browser pages and logins start fresh." });
    T.items.push({ k: "s", text: "Resumed in a new worker process" });
  } else if (t === "completed") {
    const d = JSON.parse(ev.detail || "{}"); T.lastSecs = d.seconds; T.turnStart = null; T.current = null;
    addCard({ title: /error/.test(ev.summary) ? "Turn ended with an error" : "Turn finished", meta: d.seconds != null ? `${d.seconds}s` : "", metaCls: /error/.test(ev.summary) ? "bad" : "ok", body: `${d.turns ?? "?"} step${d.turns === 1 ? "" : "s"}` });
  } else if (t === "status") {
    T.status = ev.summary;
    if (meta) meta.status = ev.summary;
    for (const [, c] of T.openTools) if (!ALIVE.includes(ev.summary)) setCardMeta(c, "Interrupted", "bad");
    if (!ALIVE.includes(ev.summary)) { T.openTools.clear(); T.turnStart = null; T.current = null; }
    if (["stopped", "failed"].includes(ev.summary)) {
      T.items.push({ k: ev.summary === "failed" ? "e" : "s", text: `Worker ${ev.summary}${ev.detail && ev.detail !== "stopped by the user" ? `: ${ev.detail}` : ""}` });
      addCard({ title: ev.summary === "failed" ? "Failed" : "Stopped", meta: "", metaCls: "bad", body: esc(ev.detail || "") });
    }
    if (["waiting", "finished", "stopped", "failed"].includes(ev.summary)) { refreshMeta(); loadRuns(); }
    renderRunState();
  }
  scheduleCanvas();
}
// Cards in the activity panel: only real worker events, newest last.
function addCard({ title, meta: m, metaCls = "", body }) {
  const el = document.createElement("li");
  el.className = "card";
  el.innerHTML = `<div class="ch"><span class="ct m12 ell">${esc(title)}</span><span class="cm m11 ${metaCls}">${m ? esc(m) : ""}</span></div><div class="cb">${body}</div>`;
  const list = $("acts"), atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
  list.appendChild(el); if (atEnd) list.scrollTop = list.scrollHeight;
  const card = { el }; T.cards.push(card); return card;
}
function setCardMeta(card, text, cls) { const m = card.el.querySelector(".cm"); m.className = `cm m11 ${cls}`; m.textContent = text; }
function addTurn(ev) {
  if (T.n < 2) return;
  const el = document.createElement("li"); el.className = "turn m11";
  el.textContent = `Message ${T.n} · ${new Date(ev.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  $("acts").appendChild(el);
}
$("acts").onclick = (e) => { const a = e.target.closest("[data-art]"); if (a) openFile({ path: a.dataset.art, run: runId }); };
$("acts").onkeydown = (e) => { if (e.key === "Enter") { const a = e.target.closest("[data-art]"); if (a) openFile({ path: a.dataset.art, run: runId }); } };
async function refreshMeta() { if (!runId) return; const id = runId; try { const m = await api("GET", `/runs/${id}`); if (runId === id) { meta = m; renderRunState(); } } catch {} }

let canvasQueued = false;
function scheduleCanvas() { if (canvasQueued) return; canvasQueued = true; requestAnimationFrame(() => { canvasQueued = false; if (view === "chat") renderCanvas(); renderRunState(); }); }
function renderCanvas() {
  if (view !== "chat") return;
  const c = $("canvas"), w = ws();
  if (!runId) {
    c.innerHTML = `<div class="emptyst"><div class="motif">${svgIcon("terminalLg", 20, 16)}</div><h1>${esc(w.name)}</h1>
      <p>${w.profile === "inspect" ? "Ask the worker to inspect this repository: read code, trace an implementation or review a component." : "Ask the worker to inspect your repository, analyze an implementation, debug an issue, or test components."}</p>
      <div class="tagline m11"><span title="${esc(w.root)}"><span class="dot grey"></span><span class="ell" style="max-width:360px">${esc(w.root)}</span></span><span><span class="dot"></span>${modeOf(w)}</span></div></div>`;
    return;
  }
  const atEnd = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
  const working = ["starting", "running"].includes(T.status);
  c.innerHTML = `<div class="thread" role="log" aria-label="Conversation">${T.items.map((it) =>
    it.k === "u" ? `<div class="msg-u">${esc(it.text)}</div>`
    : it.k === "w" ? `<div class="msg-w">${md(it.text)}</div>`
    : `<div class="sys m11 ${it.k === "e" ? "err" : ""}">${esc(it.text)}</div>`).join("")}
    ${working ? `<div class="working m11"><span class="dot pulse"></span><span class="ell">${T.status === "starting" ? "Starting the worker…" : `Working${T.current ? ` · ${esc(T.current)}` : "…"}`}</span></div>` : ""}</div>`;
  if (atEnd || working) c.scrollTop = c.scrollHeight;
}
function renderRunState() {
  const st = runId ? (T?.status || meta?.status) : null;
  const [label, cls] = st ? (STATE[st] || [st, "grey"]) : ["Ready", ""];
  $("rState").textContent = label; setDot($("rDot"), cls);
  const working = ["starting", "running"].includes(st);
  $("endBtn").hidden = st !== "waiting";
  const send = $("send");
  send.classList.toggle("stop", working);
  send.innerHTML = working ? svgIcon("stop", 9, 9) : svgIcon("arrowUp", 11, 11);
  send.setAttribute("aria-label", working ? "Stop the worker" : runId ? "Send" : "Start a run");
  $("live").hidden = !(es && es.readyState === 1 && ALIVE.includes(st));
  setDot($("aDot"), cls); $("aState").textContent = st ? label : "Idle";
  $("input").placeholder = runId ? (working ? "The worker is busy. Stop it, or wait to reply…" : "Reply to the worker…") : $("input").placeholder;
}
setInterval(() => {
  if (T?.turnStart && ["starting", "running"].includes(T.status)) $("aTime").textContent = `${((Date.now() - T.turnStart) / 1000).toFixed(2)}s execution`;
  else $("aTime").textContent = `${T?.lastSecs != null ? Number(T.lastSecs).toFixed(2) : "0.00"}s execution`;
}, 100);

// ---------------- sending (nothing runs unless the person sends) ----------------
async function send() {
  const st = runId ? (T?.status || meta?.status) : null;
  if (["starting", "running"].includes(st)) { await api("POST", `/runs/${runId}/stop`).catch(notice); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("send").disabled = true;
  try {
    if (!runId) {
      await loadRuns();
      // One worker at a time. A new chat closes a previous conversation that's only waiting
      // (it can be continued later); a busy one has to be stopped first.
      if (ACTIVE && ACTIVE.status !== "waiting") throw new Error("The worker is busy with another conversation. Open it from Recent runs and stop it first.");
      if (ACTIVE) await endAndWait(ACTIVE.id);
      const m = await api("POST", "/runs", { prompt: text, workspace: wsId });
      $("input").value = ""; autosize();
      await loadRuns(); await openRun(m.id);
    } else {
      if (ACTIVE && ACTIVE.id !== runId) {
        if (ACTIVE.status !== "waiting") throw new Error("The worker is busy with another conversation. Stop it first.");
        await endAndWait(ACTIVE.id);
      }
      await api("POST", `/runs/${runId}/message`, { text });
      $("input").value = ""; autosize(); refreshMeta(); loadRuns();
    }
  } catch (e) { notice(e.message); }
  finally { $("send").disabled = false; }
}
async function endAndWait(id) {
  await api("POST", `/runs/${id}/end`);
  for (let i = 0; i < 50; i++) { const r = await api("GET", "/runs"); if (!r.active) return; await new Promise((ok) => setTimeout(ok, 200)); }
  throw new Error("The previous conversation didn't close. Try again.");
}
$("send").onclick = send;
$("endBtn").onclick = () => runId && api("POST", `/runs/${runId}/end`).catch(notice);
const autosize = () => { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(240, i.scrollHeight) + "px"; };
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!["starting", "running"].includes(T?.status)) send(); } });

// Errors show briefly in the footnote, where the design keeps its small print.
let noticeTimer;
function notice(e) {
  const msg = typeof e === "string" ? e : e.message;
  $("footL").innerHTML = `<span class="err" role="alert">${esc(msg)}</span>`;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(setFootL, 9000);
}
const setFootL = () => { $("footL").textContent = `Runs locally via console port ${location.port || 80}`; };

// small screens
$("actToggle").onclick = () => { const on = document.body.classList.toggle("show-act"); $("actToggle").setAttribute("aria-expanded", on); };
$("navToggle").onclick = () => { const on = document.body.classList.toggle("show-nav"); $("navToggle").setAttribute("aria-expanded", on); };

// ---------------- start ----------------
(async () => {
  setFootL(); $("srvPort").textContent = `:${location.port || 80}`;
  T = freshState();
  try { await loadWorkspaces(); } catch (e) { notice(e); return; }
  await Promise.all([loadPrompts().catch(notice), loadRuns()]);
  loadTree();
  if (ACTIVE) openRun(ACTIVE.id); else openNewChat();
  setInterval(() => { if (!document.hidden) loadRuns(); }, 4000);
})();
</script>
</body>
</html>
