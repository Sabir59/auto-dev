<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,700;1,700&family=Inter:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500&display=block">
<style>
  /* Values from ../spec.json only. */
  :root {
    --screen-bg: #f7f6f3; --text-strong: #18181a; --text-muted: #78776f; --placeholder: #59605b;
    --border: #ebe8e1; --surface: #ffffff; --on-primary: #ffffff; --primary: #163a2d;
    --secondary: #f6f3ec; --on-secondary: #163a2d; --nav-active: #163a2d; --nav-active-bg: #dbf4e8;
    --nav-inactive: #414844; --status-warning: #d9790e; --legacy-button-bg: #3d4ee8;
  }
  * { box-sizing: border-box; margin: 0; }
  .screen { position: relative; width: 422px; height: 672px; overflow: hidden; background: var(--screen-bg);
    display: flex; flex-direction: column; gap: 24px; padding: 40px 24px 24px; }
  .header { display: flex; flex-direction: column; gap: 14px; }
  .headline { font: 700 46px/52px Georgia, serif; color: var(--text-strong); white-space: nowrap; }
  .headline em { font-style: italic; display: block; }
  .subtitle { font: 400 14px/17px "Inter"; color: var(--text-muted); }
  .card { background: var(--surface); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; }
  .input-card { border: 1px solid var(--border); box-shadow: 0 1px 2px 0 rgb(0 36 25 / 0.06); gap: 16px; }
  .active-card { box-shadow: 0 8px 24px 0 rgb(0 0 0 / 0.06); gap: 6px; }
  .placeholder { font: 400 16px/20px "Plus Jakarta Sans"; color: var(--placeholder); }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 9999px; height: 40px; }
  .btn span { font: 500 16px/20px "Plus Jakarta Sans"; }
  .btn--secondary { background: var(--secondary); color: var(--on-secondary); }
  .btn--primary { background: var(--primary); color: var(--on-primary); }
  .btn--legacy { background: var(--legacy-button-bg); color: var(--on-primary); height: 37px; border-radius: 999px; }
  .btn--legacy span { font: 700 14px/17px "Inter"; }
  /* icon SVGs include 1px stroke bleed per side */
  .icon16 { width: 18px; height: 18px; margin: -1px; }
  .icon22 { width: 24px; height: 24px; margin: -1px; }
  .overline { font: 700 11px/13px "Inter"; letter-spacing: 1.2px; color: var(--text-muted); }
  .card-title { font: 700 19px/23px "Inter"; color: var(--text-strong); }
  .status { font: 400 14px/17px "Inter"; color: var(--status-warning); }
  .nav { position: absolute; left: 0; top: 606px; width: 422px; height: 76px; background: var(--surface);
    border: 1px solid var(--border); padding: 8px; display: flex; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; color: var(--nav-inactive); }
  .tab .indicator { width: 56px; height: 30px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; }
  .tab--active { color: var(--nav-active); }
  .tab--active .indicator { background: var(--nav-active-bg); }
  .tab span { font: 500 12px/16px "Plus Jakarta Sans"; letter-spacing: 0.01em; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="header">
    <h1 class="headline">What do you<em>need help with?</em></h1>
    <p class="subtitle">Tell me in plain language — I'll handle the rest.</p>
  </div>
  <div class="card input-card">
    <p class="placeholder">I need to apply for a Brazilian tourist visa…</p>
    <div class="row">
      <button class="btn btn--secondary"><span>Speak</span><svg class="icon16" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M17 7.54545V9C17 15.7855 1 15.7855 1 9V7.54545M9 14.0909V17M4.42857 17H13.5714M5.57143 3.18182C5.57143 0.272727 12.4286 0.272727 12.4286 3.18182V6.81818C12.4286 9.72727 5.57143 9.72727 5.57143 6.81818V3.18182Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button>
      <button class="btn btn--primary"><span>Send</span><svg class="icon16" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M17 1.00003L8.2 9.80003M8.2 9.80003L1 6.60003L17 1.00003L11.4 17L8.2 9.80003Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button>
    </div>
  </div>
  <div class="card active-card">
    <p class="overline">ACTIVE APPLICATION</p>
    <p class="card-title">Brazilian Tourist Visa</p>
    <div class="row">
      <p class="status">Waiting for 1 document</p>
      <button class="btn btn--legacy"><span>Continue</span></button>
    </div>
  </div>
  <nav class="nav">
    <div class="tab tab--active"><div class="indicator"><svg class="icon22" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M8.33333 23V14.4444H15.6667V23M1 10.7778L12 1L23 10.7778V23H1V10.7778Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div><span>Home</span></div>
    <div class="tab"><div class="indicator"><svg class="icon22" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M1 1H10.7778V23L1 19.8571V1ZM23 1H13.2222V23L23 19.8571V1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div><span>Applications</span></div>
    <div class="tab"><div class="indicator"><svg class="icon22" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M7.875 6.78947C7.875 2.96842 10.2125 1 12 1C13.7875 1 16.125 2.96842 16.125 6.78947C16.125 10.6105 13.7875 12.5789 12 12.5789C10.2125 12.5789 7.875 10.6105 7.875 6.78947ZM1 23C1 17.2105 5.8125 14.8947 12 14.8947C18.1875 14.8947 23 17.2105 23 23H1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div><span>Profile</span></div>
  </nav>
</div>
</body>
</html>
