<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=block">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .screen { background: var(--color-background); padding: 55px var(--page-padding-x) 42px; }
  .top { display: flex; flex-direction: column; gap: var(--page-padding-top); align-items: flex-start; }
  .header, .options { display: flex; flex-direction: column; gap: var(--card-gap); align-self: stretch; }
  .step { color: var(--color-highlight); }
  .screen-title { color: var(--color-foreground); width: 350px; }
  .subtitle { color: var(--color-muted-foreground); width: 330px; }
  .footer { display: flex; flex-direction: column; gap: var(--inline-gap); align-items: center; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="top">
    <button class="btn btn--icon" aria-label="Back"><span class="icon">{{icon:chevron-left}}</span></button>
    <div class="header">
      <p class="step t-overline">Step 2 of 2</p>
      <h1 class="screen-title t-display-lg">What brings you here?</h1>
      <p class="subtitle t-body-lg">One tap. You can change this later in Settings.</p>
    </div>
  </div>
  <div class="options" role="radiogroup">
    <label class="option option--selected"><span class="leading">{{icon:sparkles}}</span><span class="text"><span class="title t-label-lg">My first ‘Umrah</span><span class="desc t-body-sm">Guide me from the very start</span></span><span class="radio radio--checked">{{icon:check}}</span></label>
    <label class="option"><span class="leading">{{icon:rotate-ccw}}</span><span class="text"><span class="title t-label-lg">A quick refresher</span><span class="desc t-body-sm">I’ve been before</span></span><span class="radio"></span></label>
    <label class="option"><span class="leading">{{icon:users}}</span><span class="text"><span class="title t-label-lg">Helping family</span><span class="desc t-body-sm">I want to teach someone</span></span><span class="radio"></span></label>
    <label class="option"><span class="leading">{{icon:book-open}}</span><span class="text"><span class="title t-label-lg">Just learning</span><span class="desc t-body-sm">No trip booked yet</span></span><span class="radio"></span></label>
  </div>
  <div class="footer">
    <button class="btn btn--lg btn--primary btn--fill t-label-lg">Continue</button>
    <button class="btn btn--default-size btn--ghost t-label-lg">Skip for now</button>
  </div>
  <div class="status-bar"><span class="t-label-lg">9:41</span><span class="system"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><i class="battery"></i></span></div>
  <div class="home-indicator"><i></i></div>
</div>
</body>
</html>
